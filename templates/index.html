
<!DOCTYPE html>
<html>
<head>
    <title>Job Application Tracker</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Job Application Tracker</h1>

    <form action="{{ url_for('addjob')}}" method="POST">
        <input type="text" name="company"
        placeholder="Company name" required>
        
        <input type="text" name="role"
        placeholder="Job role" required>
        
        <button type="submit">Add Job</button>
    </form>
    <div class="container">

        {% for job in jobs %}
            <div class="job-card">
                <h3>Company: {{ job["company"] }}</h3>
                <p>Role: {{ job["role"] }}</p>
                <p>Status: {{ job["status"] }}</p>

                <form action="{{ url_for('update_job', job_id=job['id']) }}" method="POST">
                    
                    <select name="status">
                        <option value="Applied">Applied</option>
                        <option value="Interview">Interview</option>
                        <option value="Rejected">Rejected</option>
                        <option value="Selected">Selected</option>
                    </select>
                    <button type="submit">Update Status</button>
                </form>
                <form action="{{url_for('delete_job', job_id=job['id'])}}" method="POST" onsubmit="return confirm('Are you sure you want to delete this job?');">
                    <button type="submit" id="deleteButton">X</button>
                </form>

            </div>
        {% endfor %}
    </div>
</body>
</html>
