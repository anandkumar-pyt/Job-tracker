<h2>My Applications</h2>

<table border="1">

    <tr>
        <th>Company</th>
        <th>Job Title</th>
        <th>Status</th>
        <th>Application Date</th>
    </tr>

    {% for application in applications %}

    <tr>

        <td>{{ application.company_name }}</td>

        <td>{{ application.job_title }}</td>

        <td>{{ application.status }}</td>

        <td>{{ application.application_date }}</td>

    </tr>

    {% endfor %}

</table>
